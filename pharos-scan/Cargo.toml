# ========================================================================
# Project: pharos
# Component: Network Scanner (pharos-scan)
# File: pharos-scan/Cargo.toml
# Author: Richard D. (https://github.com/iamrichardd)
# License: AGPL-3.0 (See LICENSE file for details)
# * Purpose (The "Why"):
# This tool automates the discovery of network assets and integrates with
# Pharos to facilitate bulk provisioning of machine inventory.
# * Traceability:
# Related to Task 10.2 (Issue #40)
# ========================================================================

[package]
name = "pharos-scan"
version = "0.1.0"
edition = "2024"

[dependencies]
pharos-client = { path = "../crates/pharos-client" }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-rustls = { version = "0.26", features = ["ring"] }
clap = { version = "4.5", features = ["derive"] }
mdns-sd = "0.11"
ipnet = "2.9"
if-addrs = "0.13"
pnet = "0.34"
futures = "0.3"
dns-lookup = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# For TUI (Task 10.3)
inquire = "0.9"
ratatui = "0.26"
csv = "1"

[dev-dependencies]
pharos-server = { path = "../pharos-server" }
tempfile = "3"
rcgen = "0.13"
ssh-key = { version = "0.6", features = ["ed25519"] }
rand = "0.8"
