name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Manual re-run of this pipeline against current main or a tag created after this line exists.
  # Does NOT work against refs that predate this trigger: workflow_dispatch is resolved from the
  # target ref's own copy of this file, not from main, so it can't retroactively fix old tags.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-x86_64
            ext: ""
            binaries: "pharos-server ph mdb pharos-scan pharos-pulse"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            suffix: linux-aarch64
            ext: ""
            binaries: "pharos-server ph mdb pharos-scan pharos-pulse"
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-aarch64
            ext: ""
            binaries: "ph mdb"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x86_64
            ext: ".exe"
            binaries: "pharos-server ph mdb pharos-scan pharos-pulse"

    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Build
      shell: bash
      run: |
        bin_flags=""
        for b in ${{ matrix.binaries }}; do
          bin_flags="${bin_flags} --bin ${b}"
        done
        cargo build --release --verbose --target ${{ matrix.target }} ${bin_flags}
    - name: Run tests (Rust)
      if: matrix.os == 'ubuntu-latest'
      run: cargo test --verbose --all-targets

    - name: Package and Upload Release Assets
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        assets=()
        for b in ${{ matrix.binaries }}; do
          cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" "${b}-${{ matrix.suffix }}${{ matrix.ext }}"
          assets+=("${b}-${{ matrix.suffix }}${{ matrix.ext }}")
        done

        # Ensure the release exists first (handles race condition between matrix runners)
        gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --generate-notes

        gh release upload ${{ github.ref_name }} "${assets[@]}" --clobber

  publish-images:
    name: Publish Images to GHCR
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          - name: pharos-server
            file: pharos-server/Containerfile
            context: .
          - name: pharos-pulse
            file: crates/pharos-pulse/Containerfile
            context: .
          - name: pharos-scan
            file: pharos-scan/Containerfile
            context: .
          - name: pharos-console-web
            file: pharos-console-web/Containerfile
            context: pharos-console-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Owner Name
        id: prep
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5 # Refresh to pick up Node 24 support
        with:
          images: ${{ env.REGISTRY }}/${{ steps.prep.outputs.owner_lc }}/${{ matrix.component.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
